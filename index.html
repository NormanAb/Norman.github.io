<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norman Abidaoud — Electrical Engineering</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --ink:#12161c;
    --paper:#f6f7f9;
    --paper-dim:#eceef1;
    --copper:#b5652f;
    --copper-deep:#8f4e22;
    --teal:#0f5c5c;
    --line:#d7dade;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    background-image:radial-gradient(var(--line) 1px, transparent 1px);
    background-size:22px 22px;
  }
  a{color:var(--copper-deep);}
  .wrap{max-width:920px;margin:0 auto;padding:0 28px;}

  header.nav{
    position:sticky; top:0; z-index:20;
    background:rgba(246,247,249,0.88);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  header.nav .wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:60px;
  }
  header.nav .name{
    font-family:var(--mono); font-weight:600; font-size:15px; letter-spacing:0.02em;
    text-decoration:none; color:var(--ink);
  }
  header.nav nav{display:flex; gap:22px;}
  header.nav nav a{
    color:var(--ink); text-decoration:none; font-size:14px; font-weight:500;

  }
